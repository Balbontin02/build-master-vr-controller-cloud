<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instalar Bookmarklet</title>
  <style>
    body { font-family: system-ui; padding: 20px; background: #0a0a0b; color: #e4e4e7; }
    textarea { width: 100%; height: 120px; background: #18181b; color: #e4e4e7; border: 1px solid #3f3f46; border-radius: 8px; padding: 12px; font-size: 12px; font-family: monospace; }
    button { margin-top: 12px; padding: 12px 24px; background: #0ea5e9; color: #0a0a0b; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; }
    .ok { color: #22c55e; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>BUILD MASTER VR CONNECT</h2>
  <p>Botón abajo copia el bookmarklet al portapapeles.</p>
  <textarea id="code" readonly></textarea>
  <br>
  <button onclick="copyCode()">Copiar al portapapeles</button>
  <p id="msg" class="ok" style="display:none">¡Copiado! Ahora crea un favorito y pégalo en la URL.</p>
  <script>
    fetch('build-master-vr-connect.bookmarklet.txt')
      .then(r => r.text())
      .then(t => document.getElementById('code').value = t);
    async function copyCode() {
      const t = document.getElementById('code').value;
      await navigator.clipboard.writeText(t);
      document.getElementById('msg').style.display = 'block';
    }
  </script>
</body>
</html>
